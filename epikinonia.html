           value="Πληκτρολογήστε το όνομα σας εδώ" 
           size="35" maxlength="30"/>
    
    <b id="label-msg">Μήνυμα:</b><br>
    <textarea id="input-msg" name="minyma" rows="5" cols="40">Πληκτρολογήστε το μήνυμα σας εδώ</textarea>

<script>
function switchLanguage(lang) {
  if (lang === 'en') {
    document.getElementById('page-title').innerText = "Contact";
    document.getElementById('label-name').innerText = "Name:";
    document.getElementById('input-name').value = "Type your name here";
    document.getElementById('label-msg').innerText = "Message:";
    document.getElementById('input-msg').value = "Type your message here";
    document.getElementById('submit-btn').value = "Send";
  } else {
    document.getElementById('page-title').innerText = "Επικοινωνία";
    document.getElementById('label-name').innerText = "Όνομα:";
    document.getElementById('input-name').value = "Πληκτρολογήστε το όνομα σας εδώ";
    document.getElementById('label-msg').innerText = "Μήνυμα:";
    document.getElementById('input-msg').value = "Πληκτρολογήστε το μήνυμα σας εδώ";
    document.getElementById('submit-btn').value = "Αποστολή";
  }
}
</script>
